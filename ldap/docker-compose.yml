#
# Starts DevPortal with LDAP authentication + org sync via the built-in "ldap" profile:
#
# docker compose up --no-log-prefix
#

services:
  devportal:
    image: veecode/devportal:2.1.0
    ports:
      - "7007:7007"
    volumes:
      # operator plugin boot file (Core plugins + your overrides)
      - ./dynamic-plugins.yaml:/app/dynamic-plugins.yaml:ro
    environment:
      - NODE_ENV=development
      # V2 preset — ldap carries LDAP sign-in + ldapOrg user/group sync
      # (OpenLDAP defaults: usernameAttribute uid).
      - VEECODE_PRESETS=recommended,veecode-theme,ldap
      # LDAP
      - LDAP_URL=ldap://host.docker.internal:9000
      - LDAP_DN=cn=admin,dc=vee,dc=codes
      - LDAP_SECRET=admin
      - LDAP_USERS_BASE_DN=ou=People,dc=vee,dc=codes
      - LDAP_USERS_FILTER=(uid=*)
      - LDAP_GROUPS_BASE_DN=ou=Groups,dc=vee,dc=codes
      - LDAP_GROUPS_FILTER=(objectClass=groupOfNames)
