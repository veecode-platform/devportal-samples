#
# Starts DevPortal with hot reloading and pretty logging:
#
# docker compose up --no-log-prefix | npx --yes pino-pretty --colorize --translateTime
#
# Changes to dynamic-plugins*.yaml will be processed into app-config running this:
#
# docker compose exec devportal /app/install-dynamic-plugins.sh /app/dynamic-plugins-root
#

services:
  devportal:
    # depends_on:
    #   - kubectl-proxy
    image: veecode/devportal:2.1.0
    ports:
      - "7007:7007"
    environment:
      - DEVELOPMENT=true
      - NODE_ENV=development
      # V2 baseline presets (recommended + veecode-theme), matching the V1
      # "local" profile. The Kubernetes plugin is NOT enabled via the
      # `kubernetes` preset (which needs K8S_CLUSTER_* env vars): the cluster is
      # wired via app-config.local.yaml and the k8s plugin is enabled in
      # dynamic-plugins.yaml.
      - VEECODE_PRESETS=recommended,veecode-theme
    volumes:
      # your config will add/override the default image config
      - ./app-config.yaml:/app/app-config.local.yaml:ro
      # operator plugin boot file (Core plugins + Kubernetes frontend plugin)
      - ./dynamic-plugins.yaml:/app/dynamic-plugins.yaml:ro
      # examples folder
      - ./examples:/app/examples:ro
      # RBAC policy (remove later)
      - ./rbac-policy.csv:/app/rbac-policy.csv:ro

  # kubectl-proxy:
  #   image: alpine/socat:latest
  #   command: ["tcp-listen:8001,fork,reuseaddr", "tcp-connect:host.docker.internal:8100"]
  #   network_mode: service:devportal
