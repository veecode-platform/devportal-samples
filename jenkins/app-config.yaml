#
# will merge this to bundled files
#
catalog:
  locations:
    - type: url
      target: https://github.com/veecode-platform/devportal-distro/blob/main/catalog-info.yaml
    # # Local example organizational data
    - type: file
      target: /app/examples/org.yaml
      rules:
        - allow: [User, Group]
#
# NOTE: the top-level `jenkins:` block was removed in the V2 migration.
# The `jenkins` preset (VEECODE_PRESETS=...,jenkins) now emits the FLAT
# jenkins config (jenkins.baseUrl/username/apiKey from
# ${JENKINS_URL}/${JENKINS_USERNAME}/${JENKINS_TOKEN}) itself, so this file
# no longer needs to declare it. The compose passes those three env vars.
# Requires image >= 2.1.1 (the flat-preset fix from devportal-platform#51);
# on 2.1.0 the preset still emitted the instances[] form. Do NOT re-add a
# top-level jenkins.* here: the jenkins plugin rejects mixing the flat and
# instances[] styles, which is what crashed boot before #51.
