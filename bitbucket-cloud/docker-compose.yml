#
# Starts DevPortal with Bitbucket Cloud integration:
#
# docker compose up --no-log-prefix
#

services:
  devportal:
    image: veecode/devportal:2.1.1
    ports:
      - "7007:7007"
    environment:
      - NODE_ENV=development
      # V2 presets — recommended + veecode-theme baseline. There is NO bitbucket
      # preset in the platform, so the Bitbucket Cloud integration is configured
      # manually in the mounted app-config.local.yaml below (operator override
      # loads last). The Bitbucket Cloud catalog/scaffolder plugins are
      # pre-installed marketplace extensions — see dynamic-plugins.yaml.
      - VEECODE_PRESETS=recommended,veecode-theme
      # will use shell value
      - BITBUCKET_WORKSPACE
    volumes:
      # operator plugin boot file (Core plugins + your overrides)
      - ./dynamic-plugins.yaml:/app/dynamic-plugins.yaml:ro
      # your config will add/override the default image config
      - ./app-config.yaml:/app/app-config.local.yaml:ro
