#
# Starts DevPortal with LDAP authentication + org sync via the built-in "ldap-ad" profile:
#
# docker compose up --no-log-prefix
#

services:
  devportal:
    image: veecode/devportal:latest
    ports:
      - "7007:7007"
    volumes:
      # Minimal stub for local patches — empty by default.
      #- ./app-config.local.yaml:/app/app-config.local.yaml:ro
      - ./dynamic-plugins.yaml:/app/dynamic-plugins.yaml:ro
    environment:
      - NODE_ENV=development
      # AD-tuned LDAP profile (sAMAccountName, objectClass=user/group).
      - VEECODE_PROFILE=ldap-ad
      # LDAP
      - LDAP_URL=ldap://dc1:389
      - LDAP_DN=CN=Administrator,CN=Users,DC=samdom,DC=example,DC=com
      - LDAP_SECRET=Passw0rd
      - LDAP_USERS_BASE_DN=dc=samdom,dc=example,dc=com
      - LDAP_USERS_FILTER=(objectClass=user)
      #- LDAP_USERS_FILTER=(&(objectClass=user)(!(objectClass=computer))(sAMAccountName=*)(mail=*))
      - LDAP_GROUPS_BASE_DN=dc=samdom,dc=example,dc=com
      - LDAP_GROUPS_FILTER=(objectClass=group)
      # Samba AD self-signed cert — accept it for this lab.
      - LDAP_TLS_REJECT_UNAUTHORIZED=false
      # Short sync so new samba-tool users appear without waiting an hour.
      - LDAP_SYNC_FREQUENCY=PT2M

  dc1:
    image: diegogslomp/samba-ad-dc
    #hostname: DC1
    #privileged: true
    #restart: unless-stopped
    #network_mode: host
    cap_add:
      - SYS_ADMIN
    command: >-
      bash -c "[ -f /usr/local/samba/etc/smb.conf ] || samba-domain-provision && samba -F"
    ports:
      # host:container — reach LDAP from the host as localhost:8389
      - "8389:389"
    environment:
      - REALM=SAMDOM.EXAMPLE.COM
      - DOMAIN=SAMDOM
      - ADMIN_PASS=Passw0rd
      - DNS_FORWARDER=8.8.8.8
      # Otherwise provision sets interfaces=lo eth0@ifN and Samba only listens on loopback,
      # so other containers (and published ports) cannot reach LDAP.
      - BIND_NETWORK_INTERFACES=false
    volumes:
      - dc1_etc:/usr/local/samba/etc
      - dc1_private:/usr/local/samba/private
      - dc1_var:/usr/local/samba/var
  
volumes:
  dc1_etc:
  dc1_private:
  dc1_var:
